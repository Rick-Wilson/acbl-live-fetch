"on":
  push:
    branches: [main]
    paths: ['test-ingest/**', 'demo/**', '.github/workflows/pages.yml']
  workflow_dispatch:

name: Deploy test ingester and demo videos to Pages

# Publishes two things:
#
#   /ingest/  test-ingest/, so the extension can be exercised against a real
#             https origin without depending on the Bridge Classroom
#             production ingest. Stores nothing off-device; see
#             docs/ingest-protocol.md.
#   /demo/    short recordings of the two paths that need a third-party
#             login, for store reviewers. We cannot supply BBO or ACBL
#             credentials — see docs/store-review.md § 3.
#
# The videos live on the extension's own Pages site rather than
# bridge-classroom.org: the privacy policy is shared because the extension is
# a component of Bridge Classroom, but these are the extension's own assets.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Served at <pages-url>/ingest/ — the ingest content script gates on a
      # path ending in /ingest, so the directory name is load-bearing.
      - run: |
          mkdir -p _site/ingest _site/demo
          cp test-ingest/index.html _site/ingest/index.html
          cp -R demo/. _site/demo/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
